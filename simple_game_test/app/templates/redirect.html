<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="1;url={{ redirect_url }}">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>Redirecting you...</h2>
    <div class="loader"></div>
    <p>If you are not redirected automatically, <a href="{{ redirect_url }}">click here</a>.</p>
    
    <script>
        // Disable any WebSocket functionality
        if (window.WebSocket) {
            window.WebSocket = function() { 
                console.log("WebSocket creation prevented"); 
                return { close: function() {} };
            };
        }
        
        // Redirect with plain JavaScript as a fallback
        setTimeout(function() {
            window.location.href = "{{ redirect_url }}";
        }, 1000);
    </script>
</body>
</html>
